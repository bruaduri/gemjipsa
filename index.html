<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="젬집사" />
  <meta name="theme-color" content="#0f1114" />
  <meta name="robots" content="noindex, nofollow" />
  <title>젬집사 - 우리집 생활 대시보드</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f1114'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%235ce1a8'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230f1114'/%3E%3Ccircle cx='90' cy='90' r='36' fill='%235ce1a8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      --bg: #0f1114;
      --card: #171a20;
      --card-deep: #12151a;
      --hover: #1e222a;
      --border: #272c35;
      --div: #232830;
      --ink: #ffffff;
      --sub: #aeb6c2;
      --dim: #737b88;
      --accent: #5ce1a8;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100%; width: 100%; max-width: 100vw; overflow-x: hidden;
      background: var(--bg); color: var(--ink);
      font-family: "Noto Sans KR", Inter, -apple-system, BlinkMacSystemFont, sans-serif;
      font-variant-numeric: tabular-nums;
      word-break: keep-all;
    }
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(60px + env(safe-area-inset-bottom));
    }
    .bottom-nav-wrap { padding-bottom: max(6px, env(safe-area-inset-bottom)); }
    .fade-in { animation: fadeIn 0.13s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .c-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .c-bar {
      position: relative;
      border-top-left-radius: 0;
      border-bottom-left-radius: 0;
    }
    .c-bar::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--sec-c, var(--accent));
      z-index: 2;
    }
    .c-div > * + * { border-top: 1px solid var(--div); }
    .c-row { transition: background 0.12s ease; }
    .c-row:hover { background: var(--hover); }
    .c-deep { background: var(--card-deep); border-top: 1px solid var(--div); }
    .c-sub { color: var(--sub); }
    .c-dim { color: var(--dim); }
    .c-accent { color: var(--accent); }
    .dev-tile {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-width: 0;
      transition: background 0.12s ease, border-color 0.12s ease;
    }
    .dev-tile:hover { background: var(--hover); border-color: #363d4a; }
    .icon-btn {
      width: 30px; height: 30px; min-width: 30px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 8px; border: 1px solid var(--border); background: var(--card);
      color: var(--sub); transition: all 0.12s ease;
    }
    .icon-btn:hover, .icon-btn.active { color: #ffffff; border-color: var(--accent); background: rgba(92,225,168,0.12); }
  </style>
</head>
<body class="antialiased selection:bg-[#5ce1a8]/25 selection:text-white">

  <div class="mx-auto w-full max-w-[740px] px-3 sm:px-5 pt-2.5 overflow-x-hidden">
    <!-- Top Header -->
    <header class="flex items-center justify-between gap-2 pb-2.5 border-b border-[#232830]">
      <button id="logoBtn" type="button" class="flex items-center gap-2 focus:outline-none shrink-0">
        <span class="w-2.5 h-2.5 rounded-full bg-[#5ce1a8] shadow-[0_0_8px_rgba(92,225,168,0.5)]"></span>
        <span class="text-[18px] font-bold tracking-tight text-white">젬집사</span>
      </button>
      <div class="flex items-center gap-1.5 text-[12px] shrink-0">
        <button id="calendarToggleBtn" type="button"
          class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-[#d9e0ea] hover:bg-[#1e222a] transition-colors">
          <svg class="w-3.5 h-3.5 c-sub" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span id="headerDateText" class="font-medium"></span>
        </button>
        <button id="statusToggleBtn" type="button" class="inline-flex items-center gap-1.5 px-2 py-1 rounded-md bg-[#171a20] border border-[#2a303b] text-[#d9e0ea] hover:bg-[#1e222a]">
          <span id="headerStatusDot" class="w-1.5 h-1.5 rounded-full bg-[#737b88] shrink-0"></span>
          <span id="headerBadge">확인 중</span>
        </button>
      </div>
    </header>

    <!-- Inline Monthly Calendar (Toggled by clicking 11/20 (금)) -->
    <div id="calendarPanel" class="hidden mt-2.5 c-card p-3 space-y-2.5 fade-in">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <button id="calPrevBtn" type="button" class="px-2 py-0.5 rounded bg-[#12151a] border border-[#272c35] text-[12px] c-sub hover:text-white">◀</button>
          <span id="calMonthLabel" class="text-[13.5px] font-bold text-white">2026년 11월</span>
          <button id="calNextBtn" type="button" class="px-2 py-0.5 rounded bg-[#12151a] border border-[#272c35] text-[12px] c-sub hover:text-white">▶</button>
        </div>
        <button id="closeCalendarBtn" type="button" class="text-[11.5px] c-dim hover:text-white">접기</button>
      </div>
      <div class="grid grid-cols-7 text-center text-[11px] c-dim pb-1">
        <span class="text-[#f87171]">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-[#60a5fa]">토</span>
      </div>
      <div id="calGrid" class="grid grid-cols-7 gap-1 text-center text-[12px]"></div>
      <div id="calSelectedEvents" class="pt-2 border-t border-[#232830] space-y-1 text-[12px]"></div>
    </div>

    <!-- Inline Status / Backup Panel -->
    <div id="statusPanel" class="hidden mt-2.5 c-card p-3 space-y-2 text-[12px] fade-in">
      <div class="flex items-center justify-between">
        <span id="statusPanelTitle" class="font-semibold c-accent">동기화 상태</span>
        <button id="closeStatusBtn" type="button" class="c-dim hover:text-white">접기</button>
      </div>
      <div id="statusMetaText" class="c-sub"></div>
      <div id="syncStatusText" class="text-[11.5px] c-sub">라이브 동기화 대기 중…</div>
      <div id="syncErrorText" class="hidden text-[11.5px] text-[#f87171]"></div>
      <div class="flex flex-wrap gap-1.5 pt-0.5">
        <button id="manualSyncBtn" type="button" class="px-2.5 py-1 rounded-md bg-[#5ce1a8] text-[#0f1114] font-semibold">지금 동기화</button>
        <button id="topExportBtn" type="button" class="px-2.5 py-1 rounded-md bg-[#12151a] border border-[#2a303b] text-white">JSON 내보내기</button>
        <button id="topImportBtn" type="button" class="px-2.5 py-1 rounded-md bg-[#12151a] border border-[#2a303b] text-white">JSON 복원</button>
        <input id="jsonFileInput" type="file" accept="application/json" class="hidden" />
      </div>
    </div>

    <!-- ==================== TAB 1: HOME ==================== -->
    <main id="tabHome" class="mt-3 space-y-4 fade-in">
      <!-- 1. AI 브리핑 (항상 열려 있음) -->
      <section aria-label="AI 브리핑">
        <div class="c-card c-bar p-3.5 space-y-2" style="--sec-c:#5ce1a8">
          <div class="flex items-center justify-between">
            <span class="text-[12.5px] font-bold c-accent">AI 브리핑</span>
            <span class="text-[11px] c-dim">중요 소식 · 일정 · 보증</span>
          </div>
          <div id="briefingPoints" class="space-y-1.5 text-[13px] leading-snug"></div>
        </div>
      </section>

      <!-- 2. 메일 (+ 모두 확인 + 전체 내역 보기) -->
      <section aria-label="메일">
        <div class="flex items-center justify-between mb-1.5 px-0.5">
          <div class="flex items-baseline gap-2">
            <h2 class="text-[14.5px] font-bold text-white">메일</h2>
            <span id="mailCount" class="text-[12px] c-sub"></span>
          </div>
          <div class="flex items-center gap-3 text-[12px]">
            <button id="mailAllAckBtn" type="button" class="c-accent font-medium hover:underline">모두 확인</button>
            <button id="mailShowAllBtn" type="button" class="c-sub hover:text-white font-medium"></button>
          </div>
        </div>
        <div id="homeMailList" class="c-card c-div c-bar" style="--sec-c:#60a5fa"></div>
      </section>

      <!-- 3. AI 소식 (전체 앞에 작은 검색 아이콘 · 기본 검색줄 제거) -->
      <section aria-label="AI 소식">
        <div class="flex items-center justify-between mb-1.5 px-0.5">
          <div class="flex items-baseline gap-2">
            <h2 class="text-[14.5px] font-bold text-white">AI 소식</h2>
            <span id="aiCount" class="text-[12px] c-sub"></span>
          </div>
          <div class="flex items-center gap-3 text-[12px]">
            <button id="aiAllAckBtn" type="button" class="c-accent font-medium hover:underline">모두 확인</button>
            <button id="aiExpandAllBtn" type="button" class="c-sub hover:text-white font-medium"></button>
          </div>
        </div>
        <div class="c-card c-div c-bar" style="--sec-c:#a78bfa">
          <!-- Compact Filter Bar with Search Icon right before '전체' -->
          <div id="homeAiControls" class="hidden px-3 py-2 bg-[#13161c] space-y-2 fade-in">
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              <button id="aiSearchIconBtn" type="button" aria-label="AI 소식 검색" class="icon-btn shrink-0">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </button>
              <div id="aiFilterBar" class="flex items-center gap-1 text-[11.5px]">
                <button type="button" data-af="all" class="px-2.5 py-1 rounded-md shrink-0">전체</button>
                <button type="button" data-af="unread" class="px-2.5 py-1 rounded-md shrink-0">새 소식</button>
                <button type="button" data-af="Claude" class="px-2.5 py-1 rounded-md shrink-0">Claude</button>
                <button type="button" data-af="GPT" class="px-2.5 py-1 rounded-md shrink-0">GPT</button>
                <button type="button" data-af="etc" class="px-2.5 py-1 rounded-md shrink-0">기타</button>
              </div>
            </div>
            <div id="aiSearchWrap" class="hidden flex items-center gap-1.5 fade-in">
              <input id="aiSearchInput" type="search" placeholder="키워드 입력 (Claude, Codex, 보안 등)"
                class="flex-1 min-w-0 px-2.5 py-1.5 rounded-lg bg-[#0f1114] border border-[#2a303b] text-[12.5px] text-white placeholder-[#737b88] focus:outline-none focus:border-[#a78bfa]" />
              <button id="aiSearchClearBtn" type="button" class="px-2 py-1 text-[11.5px] c-sub hover:text-white shrink-0">닫기</button>
            </div>
          </div>
          <div id="homeAiList" class="c-div"></div>
          <button id="aiToggleMoreBtn" type="button" class="w-full py-2 text-[12px] c-sub c-row text-center"></button>
        </div>
      </section>

      <!-- 4. 취미 (홈: 일정 · 지난 7일 · 앞으로 60일) -->
      <section aria-label="취미">
        <div class="flex items-center justify-between mb-1.5 px-0.5">
          <div class="flex items-baseline gap-2">
            <h2 class="text-[14.5px] font-bold text-white">취미</h2>
            <span id="hobbyCount" class="text-[12px] c-sub"></span>
          </div>
          <button id="goHobbyBtn" type="button" class="text-[12px] c-sub hover:text-white">작품 전체 보기 ›</button>
        </div>
        <div id="homeHobbySchedule" class="c-card c-div c-bar" style="--sec-c:#fbbf24"></div>
      </section>
    </main>

    <!-- ==================== TAB 2: 취미 (위: 날짜순 일정 + 아래: 작품 목록) ==================== -->
    <section id="tabHobby" class="hidden mt-3 space-y-4 fade-in" aria-label="취미">
      <div class="flex items-center justify-between">
        <h2 class="text-[16px] font-bold text-white">취미 <span id="hobbyTabCount" class="text-[12px] font-normal c-sub ml-1"></span></h2>
        <button id="hobbyAllAckBtn" type="button" class="text-[12px] c-accent font-medium hover:underline">모두 확인</button>
      </div>
      <div id="tabHobbySchedule" class="c-card c-div c-bar" style="--sec-c:#fbbf24"></div>
      <div class="space-y-2">
        <div class="flex items-center justify-between px-0.5">
          <h3 class="text-[14px] font-bold text-white">작품별 현황</h3>
          <div id="hobbyFilterBar" class="flex gap-1 text-[11.5px]">
            <button type="button" data-hf="all" class="px-2 py-0.5 rounded-md">전체</button>
            <button type="button" data-hf="unread" class="px-2 py-0.5 rounded-md">새 소식</button>
            <button type="button" data-hf="game" class="px-2 py-0.5 rounded-md">게임</button>
            <button type="button" data-hf="manga" class="px-2 py-0.5 rounded-md">만화</button>
          </div>
        </div>
        <div id="tabHobbyWorks" class="c-card c-div"></div>
      </div>
    </section>

    <!-- ==================== TAB 3: 기기·AS (삐져나옴 완벽 해결 · 검색 아이콘화) ==================== -->
    <section id="tabDevices" class="hidden mt-3 space-y-2.5 fade-in" aria-label="기기·AS">
      <!-- Warranty Briefing Card -->
      <div class="c-card c-bar p-3 space-y-1.5" style="--sec-c:#5ce1a8">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[12.5px] font-bold c-accent shrink-0">보증기간 브리핑</span>
          <span id="warrantyCounts" class="text-[11.5px] c-sub truncate"></span>
        </div>
        <div id="warrantySummary" class="text-[12.5px] c-sub leading-snug"></div>
      </div>

      <!-- Clean Single-Line Toolbar: [🔍] [카테고리 가로스크롤] [보증순|기본순] -->
      <div class="flex items-center justify-between gap-2 min-w-0">
        <div class="flex items-center gap-1.5 min-w-0 flex-1">
          <button id="devSearchIconBtn" type="button" aria-label="기기 검색" class="icon-btn shrink-0">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <div id="devGroups" class="flex items-center gap-1 overflow-x-auto no-scrollbar text-[11.5px] min-w-0"></div>
        </div>
        <div id="devSortBar" class="inline-flex p-0.5 rounded-lg bg-[#171a20] border border-[#272c35] text-[11px] shrink-0">
          <button type="button" data-dsort="warranty" class="px-2 py-1 rounded-md font-semibold">보증순</button>
          <button type="button" data-dsort="default" class="px-2 py-1 rounded-md font-medium">기본순</button>
        </div>
      </div>

      <!-- On-demand Device Search Input -->
      <div id="devSearchWrap" class="hidden flex items-center gap-1.5 fade-in">
        <input id="devSearch" type="search" placeholder="기기·브랜드·모델명 검색"
          class="flex-1 min-w-0 px-3 py-1.5 rounded-lg bg-[#171a20] border border-[#272c35] text-[12.5px] text-white placeholder-[#737b88] focus:outline-none focus:border-[#5ce1a8]" />
        <button id="devSearchClearBtn" type="button" class="px-2 py-1 text-[11.5px] c-sub hover:text-white shrink-0">닫기</button>
      </div>

      <!-- 2-Column Device Grid -->
      <div id="devGrid" class="grid grid-cols-2 gap-2"></div>
    </section>

    <!-- ==================== TAB 4: 구매함 (삐져나옴 해결 · 검색 아이콘화) ==================== -->
    <section id="tabBuy" class="hidden mt-3 space-y-2.5 fade-in" aria-label="구매함">
      <div class="flex items-center justify-between gap-2">
        <h2 class="text-[16px] font-bold text-white">구매함 <span id="buyCount" class="text-[12px] font-normal c-sub ml-1"></span></h2>
        <div class="flex items-center gap-1.5 text-[11.5px] shrink-0">
          <button id="buyExportBtn" type="button" class="px-2.5 py-1 rounded-md bg-[#171a20] border border-[#272c35] c-sub hover:text-white">JSON 백업</button>
          <button id="buyImportBtn" type="button" class="px-2.5 py-1 rounded-md bg-[#171a20] border border-[#272c35] c-sub hover:text-white">복원</button>
        </div>
      </div>

      <!-- Clean Single-Line Toolbar: [🔍] [전체 | 고정 | 정기] -->
      <div class="flex items-center gap-1.5 min-w-0">
        <button id="buySearchIconBtn" type="button" aria-label="구매함 검색" class="icon-btn shrink-0">
          <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <div id="buyKindBar" class="inline-flex p-0.5 rounded-lg bg-[#171a20] border border-[#272c35] text-[11.5px] shrink-0">
          <button type="button" data-bkind="all" class="px-2.5 py-1 rounded-md font-medium">전체</button>
          <button type="button" data-bkind="고정" class="px-2.5 py-1 rounded-md font-medium">고정</button>
          <button type="button" data-bkind="정기" class="px-2.5 py-1 rounded-md font-medium">정기</button>
        </div>
      </div>

      <!-- On-demand Buy Search Input -->
      <div id="buySearchWrap" class="hidden flex items-center gap-1.5 fade-in">
        <input id="buySearch" type="search" placeholder="품목·제품명 검색"
          class="flex-1 min-w-0 px-3 py-1.5 rounded-lg bg-[#171a20] border border-[#272c35] text-[12.5px] text-white placeholder-[#737b88] focus:outline-none focus:border-[#5ce1a8]" />
        <button id="buySearchClearBtn" type="button" class="px-2 py-1 text-[11.5px] c-sub hover:text-white shrink-0">닫기</button>
      </div>

      <div id="buyGrid" class="grid grid-cols-2 gap-2"></div>
    </section>
  </div>

  <!-- Fixed 4-Tab Bottom Navigation -->
  <nav aria-label="하단 메뉴" class="bottom-nav-wrap fixed bottom-0 left-0 right-0 z-30 bg-[#0d0f12]/95 backdrop-blur-md border-t border-[#232830] pt-1.5 px-3">
    <div id="bottomNav" class="mx-auto max-w-[520px] grid grid-cols-4 gap-1 text-[11.5px] font-semibold">
      <button type="button" data-tab="home" class="flex items-center justify-center gap-1 py-1.5 rounded-lg transition-colors">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        <span>홈</span>
      </button>
      <button type="button" data-tab="hobby" class="flex items-center justify-center gap-1 py-1.5 rounded-lg transition-colors">
        <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4M8 10v4"/><circle cx="15.5" cy="11" r="1"/><circle cx="17.5" cy="13" r="1"/></svg>
        <span>취미</span>

            date: String(n.date || ''),
            fullDate: String(n.fullDate || ''),
            title,
            summary: String(n.summary || ''),
            action: String(n.action || ''),
            source: String(n.source || ''),
            url: typeof n.url === 'string' ? n.url : '',
            unread: ackMap && ackMap[title] ? false : !!n.unread,
          });
        });
        return { items, skipped };
      }

      function sanitizeHobbies(arr, ackMap) {
        if (!Array.isArray(arr)) return { items: [], skipped: arr == null ? 0 : 1 };
        const items = [];
        let skipped = 0;
        arr.forEach((h, idx) => {
          if (!h || typeof h !== 'object' || !h.name) { skipped += 1; return; }
          const id = String(h.id || ('hobby-' + idx));
          const date = String(h.date || '');
          let news = [];
          if (Array.isArray(h.news)) {
            h.news.forEach((ni) => {
              if (ni && typeof ni === 'object' && (ni.text || ni.date || ni.iso)) {
                news.push({
                  date: String(ni.date || ''),
                  iso: String(ni.iso || ''),
                  text: String(ni.text || ''),
                  url: typeof ni.url === 'string' ? ni.url : '',
                });
              } else {
                skipped += 1;
              }
            });
          } else if (h.news != null) {
            skipped += 1;
          }
          let nextDates = [];
          if (Array.isArray(h.nextDates)) {
            h.nextDates.forEach((nd) => {
              if (nd && typeof nd === 'object' && nd.date) {
                nextDates.push({ date: String(nd.date), label: String(nd.label || '') });
              } else {
                skipped += 1;
              }
            });
          } else if (h.nextDates != null) {
            skipped += 1;
          }
          items.push(Object.assign({}, h, {
            id,
            name: String(h.name),
            shortName: String(h.shortName || h.name),
            date,
            fullDate: String(h.fullDate || ''),
            summary: String(h.summary || ''),
            latest: String(h.latest || ''),
            next: String(h.next || ''),
            url: typeof h.url === 'string' ? h.url : '',
            news,
            nextDates,
            unread: ackMap && ackMap[id + ':' + date] ? false : !!h.unread,
          }));
        });
        return { items, skipped };
      }

      function sanitizeObjectList(arr, requiredKey) {
        if (!Array.isArray(arr)) return { items: [], skipped: arr == null ? 0 : 1 };
        const items = [];
        let skipped = 0;
        arr.forEach((x) => {
          if (x && typeof x === 'object' && (!requiredKey || x[requiredKey])) items.push(x);
          else skipped += 1;
        });
        return { items, skipped };
      }

      function sanitizeAiTip(tip, fallback) {
        if (tip && typeof tip === 'object' && typeof tip.text === 'string') {
          return { date: String(tip.date || ''), text: tip.text };
        }
        return fallback || { date: '', text: '' };
      }

      const DEFAULT_STATE = {
        tab: 'home',
        mailShowAll: false,
        aiShowAll: false,
        aiFilter: 'all',
        hobbyFilter: 'all',
        devSort: 'warranty',
        devGroup: '전체',
        buyKind: 'all',
        calYear: INIT_KST.y,
        calMonth: INIT_KST.m,
        calSelected: INIT_KST.iso,
        openIds: {},
        ackedMail: {},
        ackedAi: {},
        ackedHobby: {},
        lastSyncAt: '',
        mailLastRun: SEED.mailLastRun || '',
        mailItems: sanitizeMailItems(SEED.mailItems).items,
        aiTip: sanitizeAiTip(SEED.aiTip),
        aiNews: sanitizeAiNews(SEED.aiNews).items,
        hobbies: sanitizeHobbies(SEED.hobbies).items,
        devices: sanitizeObjectList(SEED.devices, 'name').items,
        purchaseItems: sanitizeObjectList(SEED.purchaseItems, 'name').items,
      };

      function normalizeState(rawObj) {
        const base = JSON.parse(JSON.stringify(DEFAULT_STATE));
        const merged = Object.assign(base, rawObj && typeof rawObj === 'object' ? rawObj : {});
        if (!merged.openIds || typeof merged.openIds !== 'object') merged.openIds = {};
        if (!merged.ackedMail || typeof merged.ackedMail !== 'object') merged.ackedMail = {};
        if (!merged.ackedAi || typeof merged.ackedAi !== 'object') merged.ackedAi = {};
        if (!merged.ackedHobby || typeof merged.ackedHobby !== 'object') merged.ackedHobby = {};

        let skipped = 0;
        const mRes = sanitizeMailItems(merged.mailItems, merged.ackedMail);
        const aRes = sanitizeAiNews(merged.aiNews, merged.ackedAi);
        const hRes = sanitizeHobbies(merged.hobbies, merged.ackedHobby);
        const dRes = sanitizeObjectList(merged.devices, 'name');
        const pRes = sanitizeObjectList(merged.purchaseItems, 'name');
        skipped = mRes.skipped + aRes.skipped + hRes.skipped + dRes.skipped + pRes.skipped;

        merged.mailItems = mRes.items.length ? mRes.items : base.mailItems;
        merged.aiNews = aRes.items.length ? aRes.items : base.aiNews;
        merged.hobbies = hRes.items.length ? hRes.items : base.hobbies;
        merged.devices = dRes.items.length ? dRes.items : base.devices;
        merged.purchaseItems = pRes.items.length ? pRes.items : base.purchaseItems;
        merged.aiTip = sanitizeAiTip(merged.aiTip, base.aiTip);
        if (skipped > 0) {
          syncMeta.skippedCount = Math.max(syncMeta.skippedCount, skipped);
          if (syncMeta.status === 'idle') syncMeta.status = 'warn';
        }
        return merged;
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return normalizeState({});
          return normalizeState(JSON.parse(raw));
        } catch (e) {
          syncMeta.status = 'warn';
          syncMeta.lastError = '저장된 브라우저 데이터를 복구했습니다.';
          return normalizeState({});
        }
      }
      function saveState() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      }

      let state = loadState();
      let toastTimer = null;

      function esc(s) {
        return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function won(n) {
        return typeof n === 'number' && isFinite(n) && n > 0 ? n.toLocaleString('ko-KR') + '원' : '';
      }
      function showToast(m) {
        const el = document.getElementById('toast');
        el.textContent = m; el.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.add('hidden'), 1700);
      }
      function copyText(t) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(() => showToast('복사했어요.')).catch(() => fallbackCopy(t));
        } else {
          fallbackCopy(t);
        }
      }
      function fallbackCopy(t) {
        const ta = document.createElement('textarea');
        ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); showToast('복사했어요.'); } catch (e) {}
        ta.remove();
      }

      /* ---------- Date & Warranty Helpers ---------- */
      function parseDateFlex(str) {
        if (!str) return null;
        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
          const [y, m, d] = str.split('-').map(Number);
          return new Date(y, m - 1, d);
        }
        if (/^\d{4}-\d{2}$/.test(str)) {
          const [y, m] = str.split('-').map(Number);
          return new Date(y, m - 1, 1);
        }
        return null;
      }
      function dayDiff(iso) {
        const dt = parseDateFlex(iso);
        const todayDt = getTodayDt();
        if (!dt || !todayDt) return null;
        return Math.round((dt - todayDt) / 86400000);
      }
      function getNewsIso(ni, h) {
        if (!ni || typeof ni !== 'object') return '';
        if (ni.iso && /^\d{4}-\d{2}-\d{2}$/.test(ni.iso)) return ni.iso;
        if (ni.date && /^\d{2}\/\d{2}$/.test(ni.date)) {
          const baseYear = (h && h.fullDate && /^\d{4}-/.test(h.fullDate)) ? h.fullDate.slice(0, 4) : String(getKstNow().y);
          return `${baseYear}-${ni.date.replace('/', '-')}`;
        }
        return (h && h.fullDate && /^\d{4}-\d{2}-\d{2}$/.test(h.fullDate)) ? h.fullDate : '';
      }
      function fmtMdWd(iso) {
        const dt = parseDateFlex(iso);
        if (!dt) return iso || '';
        return `${dt.getMonth() + 1}/${dt.getDate()} ${WD[dt.getDay()]}`;
      }
      function addMonths(dt, months) {
        return new Date(dt.getFullYear(), dt.getMonth() + months, dt.getDate());
      }
      function fmtIso(dt) {
        return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
      }

      function warrantyInfo(d) {
        if (d.own === '임대') return { status: 'rental', rank: 4, days: null, label: '임대', end: '', basis: '', cls: 'bg-[#252a34] text-[#93c5fd]' };
        const baseStr = d.bought || d.made || '';
        const basis = d.bought ? '구입일 기준' : (d.made ? '제조일 기준' : '');
        const baseDt = parseDateFlex(baseStr);
        if (d.months && baseDt) {
          const endDt = addMonths(baseDt, Number(d.months));
          const days = Math.round((endDt - getTodayDt()) / 86400000);
          const end = fmtIso(endDt);
          if (days < 0) return { status: 'expired', rank: 3, days, label: '보증 만료', end, basis, cls: 'bg-[#232730] text-[#7c8594]' };
          if (days <= 60) return { status: 'soon', rank: 0, days, label: `임박 D-${days}`, end, basis, cls: 'bg-[#b91c1c] text-white' };
          return { status: 'active', rank: 1, days, label: `보증 D-${days}`, end, basis, cls: 'bg-[#173528] text-[#5ce1a8]' };
        }
        if (d.months) return { status: 'unknown_date', rank: 2, days: null, label: `보증 ${d.months}m (미정)`, end: '', basis: '', cls: 'bg-[#2e2618] text-[#fbbf24]' };
        return { status: 'none', rank: 5, days: null, label: '미확인', end: '', basis: '', cls: 'bg-[#20242c] text-[#737b88]' };
      }

      /* ---------- Monthly Calendar ---------- */
      function buildCalendarEventsMap() {
        const map = {};
        const add = (iso, tag, color, text) => {
          if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return;
          if (!map[iso]) map[iso] = [];
          map[iso].push({ tag, color, text });
        };
        state.hobbies.forEach((h) => {
          const short = h.shortName || h.name;
          (h.nextDates || []).forEach((nd) => add(nd.date, '취미', '#fbbf24', `${short} · ${nd.label}`));
          (Array.isArray(h.news) ? h.news : []).slice(0, 1).forEach((ni) => {
            const iso = getNewsIso(ni, h);
            if (iso) add(iso, '소식', '#93c5fd', `${short} · ${ni.text}`);
          });
        });
        state.devices.forEach((d) => {
          const w = warrantyInfo(d);
          if (w.end && (w.status === 'soon' || w.status === 'active')) {
            add(w.end, '보증', '#5ce1a8', `${d.name} 보증 만료 예정`);
          }
        });
        return map;
      }

      function renderCalendar() {
        const y = state.calYear, m = state.calMonth;
        document.getElementById('calMonthLabel').textContent = `${y}년 ${m + 1}월`;
        const evMap = buildCalendarEventsMap();
        const firstDay = new Date(y, m, 1).getDay();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        let cells = '';
        for (let i = 0; i < firstDay; i++) cells += '<div></div>';
        for (let d = 1; d <= daysInMonth; d++) {
          const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const evs = evMap[iso] || [];
          const isToday = iso === getTodayIso();
          const isSel = iso === state.calSelected;
          const cls = isSel
            ? 'bg-[#5ce1a8] text-[#0f1114] font-bold'
            : isToday
              ? 'border border-[#5ce1a8] text-white font-bold'
              : 'text-[#d5dae1] hover:bg-[#1e222a]';
          const dots = evs.slice(0, 3).map((e) => `<span class="w-1 h-1 rounded-full" style="background:${isSel ? '#0f1114' : e.color}"></span>`).join('');
          cells += `
            <button type="button" data-cal-day="${iso}" class="py-1.5 rounded-lg flex flex-col items-center justify-center gap-0.5 ${cls}">
              <span>${d}</span>
              <span class="flex gap-0.5 h-1">${dots}</span>
            </button>
          `;
        }
        document.getElementById('calGrid').innerHTML = cells;

        const selEvs = evMap[state.calSelected] || [];
        document.getElementById('calSelectedEvents').innerHTML = selEvs.length
          ? `<div class="text-[11.5px] c-dim mb-1">${fmtMdWd(state.calSelected)} 일정</div>` +
            selEvs.map((e) => `<div class="flex items-start gap-2"><span class="font-semibold shrink-0" style="color:${e.color}">${esc(e.tag)}</span><span class="text-white">${esc(e.text)}</span></div>`).join('')
          : `<div class="c-dim">${fmtMdWd(state.calSelected)} 등록된 일정이 없습니다.</div>`;
      }

      /* ---------- Hobby Schedule ---------- */
      function getHobbySchedule() {
        const past = [], future = [];
        state.hobbies.forEach((h) => {
          const short = h.shortName || h.name;
          (Array.isArray(h.news) ? h.news : []).forEach((ni, idx) => {
            const iso = getNewsIso(ni, h);
            const diff = dayDiff(iso);
            if (diff !== null && diff >= -7 && diff <= 0) {
              past.push({
                id: `p-${h.id}-${idx}`, hobbyId: h.id, diff, mdwd: fmtMdWd(iso),
                name: short, text: ni.text || h.summary, url: ni.url || h.url,
                unread: idx === 0 && h.unread, badge: diff === 0 ? '오늘' : `${Math.abs(diff)}일 전`,
              });
            }
          });
          (h.nextDates || []).forEach((nd, idx) => {
            const diff = dayDiff(nd.date);
            if (diff !== null && diff >= 0 && diff <= 60) {
              future.push({
                id: `f-${h.id}-${idx}`, hobbyId: h.id, diff, mdwd: fmtMdWd(nd.date),
                name: short, text: nd.label, url: h.url,
                unread: h.unread, badge: diff === 0 ? '오늘' : `D-${diff}`,
              });
            }
          });
        });
        past.sort((a, b) => a.diff - b.diff);
        future.sort((a, b) => a.diff - b.diff);
        return { past, future };
      }

      function renderScheduleHtml(sched, pfx) {
        const row = (r, isFuture) => {
          const k = `${pfx}-${r.id}`;
          const open = !!state.openIds[k];
          let badge = `<span class="shrink-0 text-[11.5px] c-sub">${esc(r.badge)}</span>`;
          if (isFuture) {
            const cls = r.diff <= 4 ? 'bg-[#b91c1c] text-white' : r.diff <= 7 ? 'bg-[#ca8a04] text-[#0d0e10]' : 'bg-[#262b34] text-[#d5dae1]';
            badge = `<span class="shrink-0 px-2 py-0.5 rounded text-[11px] font-bold ${cls}">${esc(r.badge)}</span>`;
          }
          return `
            <div>
              <button type="button" data-acc="${esc(k)}" class="w-full flex items-center gap-2.5 px-3.5 py-2.5 text-left c-row">
                <span class="w-12 shrink-0 text-[12px] ${r.diff === 0 ? 'font-bold text-white' : 'c-sub'}">${esc(r.mdwd)}</span>
                <p class="min-w-0 flex-1 text-[13px] leading-snug line-clamp-2">
                  <span class="font-bold text-white">${esc(r.name)}</span>
                  <span class="mx-1 c-dim">·</span>
                  <span class="c-sub">${esc(r.text)}</span>
                </p>
                ${badge}
              </button>
              ${open ? `
                <div class="px-3.5 py-2 c-deep flex items-center justify-between gap-2 text-[12px] fade-in">
                  ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer" class="text-[#93c5fd] hover:underline">공식 출처 열기 ↗</a>` : '<span class="c-dim">출처 없음</span>'}
                  <button type="button" data-hb-ack="${esc(r.hobbyId)}" class="px-2.5 py-1 rounded-md ${r.unread ? 'bg-[#5ce1a8] text-[#0f1114] font-semibold' : 'bg-[#252932] c-sub'} text-[11.5px]">${r.unread ? '확인함' : '안읽음'}</button>
                </div>
              ` : ''}
            </div>
          `;
        };
        const divider = `
          <div class="flex items-center gap-2.5 px-3.5 py-2">
            <div class="flex-1 border-t border-dashed border-[#3b5278]"></div>
            <span class="text-[11.5px] font-semibold text-[#93c5fd] shrink-0">오늘 ${esc(getKstNow().label)}</span>
            <div class="flex-1 border-t border-dashed border-[#3b5278]"></div>
          </div>
        `;
        return `
          <div class="px-3.5 pt-2.5 pb-1 text-[11.5px] c-dim">일정 · 지난 7일 · 앞으로 60일</div>
          ${sched.past.map((r) => row(r, false)).join('')}
          ${divider}
          ${sched.future.map((r) => row(r, true)).join('')}
        `;
      }

      function renderAiRow(n) {
        const k = `ai-${n.id}`;
        const open = !!state.openIds[k];
        return `
          <div>
            <button type="button" data-acc="${esc(k)}" class="w-full px-3.5 py-2.5 text-left c-row">
              <div class="flex items-center gap-1.5 text-[11.5px] c-dim">
                <span class="w-1.5 h-1.5 rounded-full ${n.unread ? 'bg-[#ef4444]' : 'bg-[#353a44]'} shrink-0"></span>
                <span>${esc(n.date)}</span>
                <span class="text-[#93c5fd] font-medium">${esc(n.cat)}</span>

                <span class="ml-auto text-[10.5px]">${open ? '∧' : '∨'}</span>
              </div>
              <div class="mt-0.5 text-[13.5px] font-medium text-white leading-snug line-clamp-2">${esc(n.title)}</div>
            </button>
            ${open ? `
              <div class="px-3.5 py-2.5 c-deep space-y-2 text-[12.5px] fade-in">
                <p class="c-sub leading-relaxed">${esc(n.summary)}</p>
                ${n.action ? `<div class="text-[12px] c-accent">참고: ${esc(n.action)}</div>` : ''}
                <div class="flex items-center justify-between pt-0.5">
                  ${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener noreferrer" class="text-[12px] text-[#93c5fd] hover:underline">원문 열기 ↗</a>` : `<span class="text-[11.5px] c-dim">${esc(n.source)}</span>`}
                  <button type="button" data-ai-ack="${esc(n.id)}" class="px-2.5 py-1 rounded-md ${n.unread ? 'bg-[#5ce1a8] text-[#0f1114] font-semibold' : 'bg-[#252932] c-sub'} text-[11.5px]">${n.unread ? '확인함' : '안읽음'}</button>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

        const kstNow = getKstNow();
        lastRenderedDateIso = kstNow.iso;
        document.getElementById('headerDateText').textContent = kstNow.label;
        updateStatusUi(total);
        document.getElementById('statusMetaText').textContent =
          `메일 ${state.mailItems.length} · AI 소식 ${state.aiNews.length} · 취미 ${state.hobbies.length} · 기기 ${state.devices.length} · 구매함 ${state.purchaseItems.length}`;

        const warrantyTxt = soonDevs.length
          ? soonDevs.map((x) => `${x.d.name} ${x.w.label}${x.w.basis === '제조일 기준' ? '(제조일 기준)' : ''}`).join(', ')
          : (activeDevs.length ? `유효 ${activeDevs.length}대 (${activeDevs[0].d.name} ${activeDevs[0].w.label})` : '임박 보증 없음');

        document.getElementById('briefingPoints').innerHTML = `
          <div class="flex gap-2"><span class="text-[#60a5fa] shrink-0">•</span><span><b class="text-white">메일:</b> ${mailUn.length ? `미확인 ${mailUn.length}건 — ${esc(mailUn[0].title)}` : '확인할 메일 없음'}</span></div>
          <div class="flex gap-2"><span class="text-[#fbbf24] shrink-0">•</span><span><b class="text-white">취미 일정:</b> ${esc(nextHobbyTxt || '가까운 일정 없음')}</span></div>
          <div class="flex gap-2"><span class="text-[#5ce1a8] shrink-0">•</span><span><b class="text-white">기기 보증:</b> ${esc(warrantyTxt)}</span></div>
          <div class="flex gap-2"><span class="text-[#a78bfa] shrink-0">•</span><span><b class="text-white">AI 소식:</b> ${aiUn.length ? `새 소식 ${aiUn.length}건 — ${esc(aiUn[0].title)}` : '모두 확인함'}</span></div>
        `;

        // 2. Mail (with '전체 N건' archive toggle!)
        document.getElementById('mailCount').textContent = mailUn.length ? `미확인 ${mailUn.length}` : '모두 확인';
        document.getElementById('mailAllAckBtn').classList.toggle('hidden', mailUn.length === 0);
        document.getElementById('mailShowAllBtn').textContent = state.mailShowAll ? '접기 ∧' : `전체 ${state.mailItems.length}건 ∨`;

        const mailRows = state.mailShowAll ? state.mailItems : mailUn;
        document.getElementById('homeMailList').innerHTML = mailRows.length
          ? mailRows.map((m) => `
              <div class="flex items-start justify-between gap-2.5 px-3.5 py-2.5 c-row">

      function updateStatusUi(unreadTotal) {
        const dot = document.getElementById('headerStatusDot');
        const badge = document.getElementById('headerBadge');
        const titleEl = document.getElementById('statusPanelTitle');
        const syncEl = document.getElementById('syncStatusText');
        const errEl = document.getElementById('syncErrorText');
        const unread = typeof unreadTotal === 'number'
          ? unreadTotal
          : (state.mailItems.filter((m) => m.unread).length + state.aiNews.filter((n) => n.unread).length + state.hobbies.filter((h) => h.unread).length);

        const hasRenderErr = syncMeta.renderErrors.length > 0;
        const missingMailRun = !state.mailLastRun;
        let effective = syncMeta.status;
        if (hasRenderErr) effective = 'error';
        else if (effective === 'ok' && (syncMeta.skippedCount > 0 || missingMailRun)) effective = 'warn';

        if (dot && badge) {
          if (effective === 'error') {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-[#f87171] shrink-0';
            badge.textContent = hasRenderErr ? '표시 오류' : '동기화 오류';
          } else if (effective === 'warn') {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-[#fbbf24] shrink-0';
            badge.textContent = '일부 오류';
          } else if (effective === 'ok') {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-[#5ce1a8] shrink-0';
            badge.textContent = unread > 0 ? `정상 · ${unread}` : '정상';
          } else {
            dot.className = 'w-1.5 h-1.5 rounded-full bg-[#737b88] shrink-0';
            badge.textContent = unread > 0 ? `확인 중 · ${unread}` : '확인 중';
          }
        }

        if (titleEl) {
          titleEl.textContent = effective === 'error' ? '동기화·표시 오류 발생' : effective === 'warn' ? '일부 데이터 주의' : '동기화 정상';
          titleEl.className = effective === 'error' ? 'font-semibold text-[#f87171]' : effective === 'warn' ? 'font-semibold text-[#fbbf24]' : 'font-semibold c-accent';
        }
        if (syncEl) {
          const parts = [];
          parts.push(state.lastSyncAt ? `마지막 성공: ${state.lastSyncAt}` : '마지막 성공: 아직 없음');
          parts.push(state.mailLastRun ? `예약 갱신: ${state.mailLastRun}` : '예약 갱신 기록 없음');
          syncEl.textContent = parts.join(' · ');
        }
        if (errEl) {
          const reasons = [];
          if (syncMeta.lastError) reasons.push(`실패 사유: ${syncMeta.lastError}`);
          if (syncMeta.skippedCount > 0) reasons.push(`형식 오류 항목 ${syncMeta.skippedCount}건 건너뜀`);
          if (missingMailRun && effective !== 'idle') reasons.push('메일 예약 실행 시각(mailLastRun) 누락');
          if (hasRenderErr) reasons.push(`렌더 오류: ${syncMeta.renderErrors.join(', ')}`);
          if (reasons.length) {
            errEl.textContent = reasons.join(' / ');
            errEl.classList.remove('hidden');
          } else {
            errEl.textContent = '';
            errEl.classList.add('hidden');
          }
        }
      }

      function safeRender(name, fn) {
        try {
          fn();
        } catch (err) {
          syncMeta.renderErrors.push(name);
          console.error('[gemjipsa render error]', name, err);
        }
      }

      function renderAll() {
        syncMeta.renderErrors = [];
        ['home', 'hobby', 'devices', 'buy'].forEach((t) => {
          const id = t === 'home' ? 'tabHome' : t === 'hobby' ? 'tabHobby' : t === 'devices' ? 'tabDevices' : 'tabBuy';
          document.getElementById(id).classList.toggle('hidden', state.tab !== t);
        });
        document.querySelectorAll('#bottomNav button').forEach((b) => {
          const act = b.dataset.tab === state.tab;
          b.className = act
            ? 'flex items-center justify-center gap-1 py-1.5 rounded-lg text-[#5ce1a8] bg-[#5ce1a8]/14 transition-colors'
            : 'flex items-center justify-center gap-1 py-1.5 rounded-lg text-[#8c95a3] hover:text-white transition-colors';
        });

        safeRender('홈', renderHome);
        if (state.tab === 'hobby') safeRender('취미', renderHobbyTab);
        if (state.tab === 'devices') safeRender('기기·AS', renderDevicesTab);
        if (state.tab === 'buy') safeRender('구매함', renderBuyTab);
        if (!document.getElementById('calendarPanel').classList.contains('hidden')) safeRender('달력', renderCalendar);
        updateStatusUi();
      }

      function exportJson() {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'gemjipsa-backup.json';
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        showToast('JSON 백업을 저장했어요.');
      }

      });

      // Hobby controls
      document.getElementById('hobbyAllAckBtn').addEventListener('click', () => { state.hobbies.forEach((h) => { h.unread = false; state.ackedHobby[h.id + ':' + h.date] = true; }); saveState(); renderAll(); showToast('취미 소식을 모두 확인했어요.'); });
      document.getElementById('hobbyFilterBar').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-hf]');
        if (b) { state.hobbyFilter = b.dataset.hf; renderHobbyTab(); }
      });

      // Devices controls + Search icon toggle
      document.getElementById('devSearchIconBtn').addEventListener('click', () => {
        const w = document.getElementById('devSearchWrap');
        const opening = w.classList.contains('hidden');
        w.classList.toggle('hidden');
        document.getElementById('devSearchIconBtn').classList.toggle('active', opening);
        if (opening) document.getElementById('devSearch').focus();
      });
      document.getElementById('devSearchClearBtn').addEventListener('click', () => {
        document.getElementById('devSearch').value = '';
        document.getElementById('devSearchWrap').classList.add('hidden');
        document.getElementById('devSearchIconBtn').classList.remove('active');
        renderDevicesTab();
      });
      document.getElementById('devSearch').addEventListener('input', renderDevicesTab);
      document.getElementById('devSortBar').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-dsort]');
        if (b) { state.devSort = b.dataset.dsort; saveState(); renderDevicesTab(); }
      });
      document.getElementById('devGroups').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-dg]');
        if (b) { state.devGroup = b.dataset.dg; renderDevicesTab(); }
      });

      // Buy controls + Search icon toggle
      document.getElementById('buySearchIconBtn').addEventListener('click', () => {
        const w = document.getElementById('buySearchWrap');
        const opening = w.classList.contains('hidden');
        w.classList.toggle('hidden');
        document.getElementById('buySearchIconBtn').classList.toggle('active', opening);
        if (opening) document.getElementById('buySearch').focus();
      });
      document.getElementById('buySearchClearBtn').addEventListener('click', () => {
        document.getElementById('buySearch').value = '';
        document.getElementById('buySearchWrap').classList.add('hidden');
        document.getElementById('buySearchIconBtn').classList.remove('active');
        renderBuyTab();
      });
      document.getElementById('buySearch').addEventListener('input', renderBuyTab);
      document.getElementById('buyKindBar').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-bkind]');
        if (b) { state.buyKind = b.dataset.bkind; renderBuyTab(); }
      });

      // Backup / Restore
      document.getElementById('topExportBtn').addEventListener('click', exportJson);
      document.getElementById('buyExportBtn').addEventListener('click', exportJson);
      document.getElementById('topImportBtn').addEventListener('click', () => document.getElementById('jsonFileInput').click());
      document.getElementById('buyImportBtn').addEventListener('click', () => document.getElementById('jsonFileInput').click());
      document.getElementById('jsonFileInput').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            state = normalizeState(Object.assign({}, state, JSON.parse(String(reader.result || '{}'))));
            saveState(); renderAll(); showToast('JSON 백업을 복원했어요.');
          } catch (err) {
            showToast('유효한 JSON 파일이 아닙니다.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });

      // Delegated row clicks
      document.body.addEventListener('click', (e) => {
        const acc = e.target.closest('button[data-acc]');
        if (acc) { state.openIds[acc.dataset.acc] = !state.openIds[acc.dataset.acc]; renderAll(); return; }
        const mt = e.target.closest('button[data-mail-toggle]');
        if (mt) { const m = state.mailItems.find((x) => x.id === mt.dataset.mailToggle); if (m) { m.unread = !m.unread; if (!m.unread) state.ackedMail[m.title] = true; else delete state.ackedMail[m.title]; saveState(); renderAll(); } return; }
        if (e.target.id === 'openMailAllInlineBtn') { state.mailShowAll = true; saveState(); renderHome(); return; }
        const aa = e.target.closest('button[data-ai-ack]');
        if (aa) { const n = state.aiNews.find((x) => x.id === aa.dataset.aiAck); if (n) { n.unread = !n.unread; if (!n.unread) state.ackedAi[n.title] = true; else delete state.ackedAi[n.title]; saveState(); renderAll(); } return; }
        const ha = e.target.closest('button[data-hb-ack]');
        if (ha) { const h = state.hobbies.find((x) => x.id === ha.dataset.hbAck); if (h) { h.unread = !h.unread; if (!h.unread) state.ackedHobby[h.id + ':' + h.date] = true; else delete state.ackedHobby[h.id + ':' + h.date]; saveState(); renderAll(); } return; }
        const cp = e.target.closest('button[data-copy]');
        if (cp) { copyText(cp.dataset.copy); }
      });

      async function syncLiveData(isManual) {
        const statusEl = document.getElementById('syncStatusText');
        if (statusEl) statusEl.textContent = 'Google Drive 최신 데이터 확인 중…';
        try {
          const res = await fetch(LIVE_API_URL + '?t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const remote = await res.json();
          if (!remote || typeof remote !== 'object') throw new Error('응답 JSON 형식 오류');

          if (!state.ackedMail) state.ackedMail = {};
          if (!state.ackedAi) state.ackedAi = {};
          if (!state.ackedHobby) state.ackedHobby = {};

          let skipped = 0;
          if (remote.mailItems != null) {
            const mRes = sanitizeMailItems(remote.mailItems, state.ackedMail);
            skipped += mRes.skipped;
            if (mRes.items.length) state.mailItems = mRes.items;
          }
          if (remote.aiNews != null) {
            const aRes = sanitizeAiNews(remote.aiNews, state.ackedAi);
            skipped += aRes.skipped;
            if (aRes.items.length) state.aiNews = aRes.items;
          }
          if (remote.hobbies != null) {
            const hRes = sanitizeHobbies(remote.hobbies, state.ackedHobby);
            skipped += hRes.skipped;
            if (hRes.items.length) state.hobbies = hRes.items;
          }
          // Preserve local devices & purchaseItems (only seed from remote when local list is empty)
          if ((!Array.isArray(state.devices) || !state.devices.length) && remote.devices != null) {
            const dRes = sanitizeObjectList(remote.devices, 'name');
            skipped += dRes.skipped;
            if (dRes.items.length) state.devices = dRes.items;
          }
          if ((!Array.isArray(state.purchaseItems) || !state.purchaseItems.length) && remote.purchaseItems != null) {
            const pRes = sanitizeObjectList(remote.purchaseItems, 'name');
            skipped += pRes.skipped;
            if (pRes.items.length) state.purchaseItems = pRes.items;
          }
          if (remote.aiTip != null) state.aiTip = sanitizeAiTip(remote.aiTip, state.aiTip);
          state.mailLastRun = typeof remote.mailLastRun === 'string' ? remote.mailLastRun.trim() : '';

          const now = new Date();
          const kst = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
          const hh = String(kst.getHours()).padStart(2, '0');
          const mm = String(kst.getMinutes()).padStart(2, '0');
          state.lastSyncAt = `${kst.getMonth() + 1}/${kst.getDate()} ${hh}:${mm}`;

          syncMeta.skippedCount = skipped;
          syncMeta.lastError = '';
          syncMeta.status = (skipped > 0 || !state.mailLastRun) ? 'warn' : 'ok';

          saveState();
          renderAll();
          if (isManual) showToast(skipped > 0 ? `동기화 완료 (${skipped}건 형식 오류 건너뜀)` : '최신 데이터로 동기화했어요.');
        } catch (err) {
          syncMeta.status = 'error';
          syncMeta.lastError = (err && err.message) ? String(err.message) : '네트워크 또는 응답 오류';
          updateStatusUi();
          if (isManual) showToast('지금은 동기화할 수 없어요. 잠시 후 다시 시도해 주세요.');
        }
      }

      function checkMidnightRollover() {
        const nowKst = getKstNow();
        if (nowKst.iso !== lastRenderedDateIso) {
          if (state.calSelected === lastRenderedDateIso) {
            state.calSelected = nowKst.iso;
            state.calYear = nowKst.y;
            state.calMonth = nowKst.m;
          }
          lastRenderedDateIso = nowKst.iso;
          renderAll();
        }
      }

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkMidnightRollover();
      });
      window.addEventListener('focus', checkMidnightRollover);
      setInterval(checkMidnightRollover, 60000);

      document.getElementById('manualSyncBtn').addEventListener('click', () => syncLiveData(true));

      renderAll();
      syncLiveData(false);
    })();
  </script>
</body>
</html>
